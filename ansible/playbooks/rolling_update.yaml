---
# ==============================================================================
# Sequential Rolling Update & Node Maintenance Playbook
# ==============================================================================
# Upgrades / repaves cluster nodes one at a time:
#   1. Worker nodes (serial: 1)
#   2. Secondary control plane nodes (serial: 1)
#   3. Primary control plane node (serial: 1)
#
# Validates Kubernetes node readiness and etcd quorum health before proceeding
# to the next node.
# ==============================================================================

# --- Step 0: Pre-Flight Cluster Health Check ---
- name: Pre-Flight Cluster Readiness Check
  hosts: k3s_control_plane[0]
  gather_facts: false
  become: true
  tasks:
    - name: Verify all existing nodes are in Ready status
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: preflight_nodes
      changed_when: false
      failed_when: "'NotReady' in preflight_nodes.stdout or preflight_nodes.rc != 0"

    - name: Check etcd quorum health
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s etcdctl endpoint health
      register: preflight_etcd
      changed_when: false
      failed_when: "'is healthy' not in preflight_etcd.stdout"

    - name: Display pre-flight health status
      ansible.builtin.debug:
        msg: "Pre-flight checks passed. Cluster is healthy and ready for sequential rolling update."

# --- Step 1: Sequential Rolling Update for Worker Nodes ---
- name: Rolling Update Worker Nodes (1-by-1)
  hosts: k3s_workers
  gather_facts: true
  become: true
  serial: 1
  vars:
    rejoining_existing_cluster: true
  tasks:
    - name: Cordon worker node
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl cordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      changed_when: true

    - name: Drain worker node workloads
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --force --grace-period=60 --timeout=180s
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      changed_when: true

    - name: Apply OS settings and system updates
      ansible.builtin.include_role:
        name: k3s_common

    - name: Configure and update K3s worker agent
      ansible.builtin.include_role:
        name: k3s_worker

    - name: Uncordon worker node
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      changed_when: true

    - name: Verify worker node is Ready in Kubernetes
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      register: worker_health
      until: worker_health.rc == 0 and worker_health.stdout == "True"
      retries: 25
      delay: 6
      changed_when: false

    - name: Settling pause before next node
      ansible.builtin.pause:
        seconds: 15

# --- Step 2: Sequential Rolling Update for Secondary Control Planes ---
- name: Rolling Update Secondary Control Plane Nodes (1-by-1)
  hosts: k3s_control_plane:!k3s_control_plane[0]
  gather_facts: true
  become: true
  serial: 1
  vars:
    rejoining_existing_cluster: true
  tasks:
    - name: Cordon secondary control plane node
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl cordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      changed_when: true

    - name: Drain secondary control plane node workloads
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --force --grace-period=60 --timeout=180s
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      changed_when: true

    - name: Apply OS settings and system updates
      ansible.builtin.include_role:
        name: k3s_common

    - name: Configure and update K3s control plane server
      ansible.builtin.include_role:
        name: k3s_control_plane

    - name: Uncordon secondary control plane node
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      changed_when: true

    - name: Verify secondary control plane node is Ready
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      register: cp_health
      until: cp_health.rc == 0 and cp_health.stdout == "True"
      retries: 25
      delay: 6
      changed_when: false


    - name: Verify etcd cluster health after node upgrade
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s etcdctl endpoint health
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      register: etcd_health
      until: "'is healthy' in etcd_health.stdout"
      retries: 15
      delay: 5
      changed_when: false

    - name: Settling pause before next control plane node
      ansible.builtin.pause:
        seconds: 20

# --- Step 3: Rolling Update for Primary Control Plane Node ---
- name: Rolling Update Primary Control Plane Node
  hosts: k3s_control_plane[0]
  gather_facts: true
  become: true
  serial: 1
  vars:
    rejoining_existing_cluster: true
    surviving_cp: "{{ (groups['k3s_control_plane'] | difference([inventory_hostname]))[0] }}"
  tasks:
    - name: Cordon primary control plane node
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl cordon {{ inventory_hostname }}
      delegate_to: "{{ surviving_cp }}"
      changed_when: true

    - name: Drain primary control plane node workloads
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --force --grace-period=60 --timeout=180s
      delegate_to: "{{ surviving_cp }}"
      changed_when: true

    - name: Apply OS settings and system updates
      ansible.builtin.include_role:
        name: k3s_common

    - name: Configure and update K3s primary control plane server
      ansible.builtin.include_role:
        name: k3s_control_plane

    - name: Uncordon primary control plane node
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ surviving_cp }}"
      changed_when: true

    - name: Verify primary control plane node is Ready
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ surviving_cp }}"
      register: primary_cp_health
      until: primary_cp_health.stdout == "True"
      retries: 25
      delay: 6
      changed_when: false

    - name: Verify etcd cluster health
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s etcdctl endpoint health
      register: final_etcd_health
      until: "'is healthy' in final_etcd_health.stdout"
      retries: 15
      delay: 5
      changed_when: false

# --- Step 4: Final Verification & Node Health Summary ---
- name: Final Rolling Update Health Verification
  hosts: k3s_control_plane[0]
  gather_facts: false
  become: true
  tasks:
    - name: Retrieve final cluster nodes with labels
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes -o wide --show-labels
      register: final_nodes_summary
      changed_when: false

    - name: Display Final Cluster Summary
      ansible.builtin.debug:
        msg: "{{ final_nodes_summary.stdout_lines }}"

    - name: Verify kube-vip Virtual IP and daemonset status
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get ds,pods -n kube-system -l app.kubernetes.io/name=kube-vip-ds -o wide
      register: final_kube_vip_summary
      changed_when: false

    - name: Display kube-vip Summary
      ansible.builtin.debug:
        msg: "{{ final_kube_vip_summary.stdout_lines }}"

