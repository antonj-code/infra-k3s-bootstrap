---
# ==============================================================================
# End-to-End Orchestration: OS Hardening & K3s High Availability Cluster Rollout
# ==============================================================================

# --- Step 0: Ensure all 6 VMs on target hypervisor (guardian/colossus) are online ---
# any_errors_fatal here so an unreachable node (e.g. inventory holding the
# unroutable internal VLAN IP instead of the management address) aborts the
# run immediately, instead of Ansible dropping it from later plays and
# k3s:verify failing ~15 minutes later on a short node count.
- name: Wait for all K3s nodes to become reachable via SSH
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for port 22 to be open
      ansible.builtin.wait_for:
        port: 22
        host: "{{ ansible_host | default(inventory_hostname) }}"
        search_regex: OpenSSH
        delay: 5
        timeout: 180
      delegate_to: localhost

    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

# --- Step 1: Base System Tuning, Sysctl, Swap, and Kernel Modules ---
# k3s_common reboots again, but need-based rather than unconditionally (see
# its tasks/main.yaml Step 7): only a node whose running kernel lacks
# transparent_hugepage=never bounces. On an initial build that is every node,
# since the VMs booted from a template that predates the argument - so serial: 2
# is doing real work here, keeping it to two nodes down at a time instead of a
# fleet-wide reboot storm. On a re-run against an already-built cluster nothing
# reboots at all.
- name: Apply OS-level and Kubernetes system settings across all nodes
  hosts: all
  gather_facts: true
  become: true
  serial: 2
  # Same reasoning as Step 0, and it matters more here: k3s_common asserts on
  # live kernel state (sysctl, THP, the kernel command line, the tuned profile)
  # rather than just writing config. Without this, one node failing an assert is
  # dropped from later plays, the remaining nodes build a short cluster, and
  # k3s:verify fails ~15 minutes downstream on a node count - burying the
  # assert's message, which said exactly what was wrong.
  any_errors_fatal: true
  roles:
    - role: k3s_common

# --- Step 2: Bootstrap Primary Control Plane Node (etcd Init) ---
- name: Initialize Primary K3s Control Plane Node
  hosts: k3s_control_plane[0]
  gather_facts: true
  become: true
  roles:
    - role: k3s_control_plane

# --- Step 3: Join Secondary Control Plane Nodes (etcd Quorum) ---
- name: Join Secondary K3s Control Plane Nodes into HA Cluster
  hosts: k3s_control_plane:!k3s_control_plane[0]
  gather_facts: true
  become: true
  serial: 1
  roles:
    - role: k3s_control_plane

# --- Step 4: Join Worker Nodes ---
- name: Join Worker Nodes to K3s Cluster
  hosts: k3s_workers
  gather_facts: true
  become: true
  serial: 2
  roles:
    - role: k3s_worker

# --- Step 5: Post-Deployment Verification & Cluster Health ---
- name: Verify K3s Cluster Status and Node Health
  hosts: k3s_control_plane[0]
  gather_facts: false
  become: true
  tasks:
    - name: Retrieve full cluster node status
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes -o wide
      register: cluster_nodes_status
      changed_when: false

    - name: Display K3s Cluster Nodes
      ansible.builtin.debug:
        msg: "{{ cluster_nodes_status.stdout_lines }}"

    - name: Check system pods running status
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get pods -A -o wide
      register: cluster_pods_status
      changed_when: false

    - name: Display K3s System Pods
      ansible.builtin.debug:
        msg: "{{ cluster_pods_status.stdout_lines }}"

    - name: Verify kube-vip HA Virtual IP status
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get ds,pods -n kube-system -l app.kubernetes.io/name=kube-vip-ds -o wide
      register: kube_vip_status
      changed_when: false

    - name: Display kube-vip HA Status
      ansible.builtin.debug:
        msg: "{{ kube_vip_status.stdout_lines }}"

# --- Step 6: Register Cluster with Vault Kubernetes Auth ---
# Runs before stage:flux:bootstrap so the "kubernetes" auth method is already
# usable the moment Flux starts reconciling anything (e.g. External Secrets
# Operator) that depends on it.
- name: Register cluster with Vault Kubernetes auth method
  hosts: k3s_control_plane[0]
  gather_facts: false
  become: true
  roles:
    - role: k3s_vault_kubernetes_auth

