---
# Dependencies and system packages
k3s_common_packages_redhat:
  - ca-certificates
  - curl
  - gnupg2
  - jq
  - tar
  - procps-ng
  - sudo
  - policycoreutils-python-utils
  - container-selinux
  - firewalld
  - iptables
  - ipset
  - ipvsadm # kube_proxy_mode is ipvs - without this there is no way to inspect it
  - iproute
  - socat
  - conntrack-tools
  - iscsi-initiator-utils
  - nfs-utils
  - xfsprogs


k3s_common_packages_debian:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - tar
  - procps
  - sudo
  - iptables
  - ipset
  - iproute2
  - socat
  - conntrack
  - open-iscsi
  - nfs-common
  - xfsprogs

# Kernel modules required for Kubernetes & IPVS
k3s_kernel_modules:
  - overlay
  - br_netfilter
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack

# Sysctl parameters tailored for Kubernetes & K3s
k3s_sysctl_settings:
  - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
  - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
  - { name: 'net.ipv4.ip_forward', value: '1' }
  - { name: 'net.ipv4.conf.all.forwarding', value: '1' }
  - { name: 'net.ipv4.conf.default.forwarding', value: '1' }
  - { name: 'net.ipv4.conf.all.log_martians', value: '0' }
  - { name: 'net.ipv4.conf.default.log_martians', value: '0' }
  - { name: 'net.ipv4.conf.all.rp_filter', value: '2' }
  - { name: 'net.ipv4.conf.default.rp_filter', value: '2' }
  - { name: 'net.ipv4.conf.all.arp_ignore', value: '1' }
  - { name: 'net.ipv4.conf.all.arp_announce', value: '2' }
  - { name: 'vm.swappiness', value: '0' }
  - { name: 'vm.max_map_count', value: '262144' }
  - { name: 'fs.inotify.max_user_watches', value: '524288' }
  - { name: 'fs.inotify.max_user_instances', value: '8192' }
  - { name: 'net.core.somaxconn', value: '4096' }

# Whether this role may reboot at the end, once all OS-level work is done and
# before any k3s role runs. This is a permission, not a schedule: the reboot
# is need-based (see tasks/main.yaml Step 7) and only happens when the running
# kernel's command line lacks transparent_hugepage=never. A node that already
# booted with it is never rebooted here again, so every path converges to zero
# reboots rather than paying one per run.
#
# Safe in every path that runs this role: site.yaml has no cluster yet at this
# point, rolling_update.yaml cordons and drains the node first, and
# redeploy_node.yaml is working on a freshly repaved VM that has not rejoined
# (and disables k3s across the bounce - see that playbook's Step 2.5).
#
# Set false to suppress the reboot entirely. The kernel argument is still
# written and takes effect at whatever reboot the node next takes; the
# post-reboot assertions are skipped, because a node that is knowingly not
# there yet should not fail them.
k3s_common_reboot: true
k3s_common_reboot_timeout: 600

# tuned profile layered over the stock base profile to keep THP off.
#
# throughput-performance sets [vm] transparent_hugepages=always, and tuned
# applies that at every boot AFTER the kernel has read its command line - so a
# stock profile silently undoes transparent_hugepage=never. The derived profile
# below include=s the base verbatim and overrides nothing but [vm], so all of
# throughput-performance's other tuning is preserved.
#
# The base is PINNED here rather than read from `tuned-adm active` on the node:
# once the derived profile is active, reading the active profile would make a
# second run include this profile into itself.
k3s_tuned_base_profile: throughput-performance
k3s_tuned_profile: k3s-throughput-performance

# Verified against the live kernel after the sysctl file is written. These are
# the parameters whose absence breaks pod networking silently rather than
# producing an obvious error - a node with ip_forward=0 still joins, still
# reports Ready, and still passes a node-count check, while dropping every
# packet destined for a pod on another node.
k3s_sysctl_required_runtime:
  - net.ipv4.ip_forward
  - net.ipv4.conf.all.forwarding
  - net.bridge.bridge-nf-call-iptables


# Firewall ports for Control Plane
k3s_control_plane_firewall_ports:
  - "6443/tcp"       # Kubernetes API Server & K3s supervisor (and kube-vip)
  - "2379-2380/tcp"  # Embedded etcd client and peer communication
  - "10250/tcp"      # Kubelet API & metrics
  - "2112/tcp"       # kube-vip Prometheus metrics endpoint
  - "53/udp"         # CoreDNS (DNS service on 10.43.0.10)
  - "53/tcp"         # CoreDNS TCP
  - "8472/udp"       # Flannel VXLAN overlay (if used)
  - "51820/udp"      # Flannel Wireguard (IPv4)
  - "51821/udp"      # Flannel Wireguard (IPv6)
  - "30000-32767/tcp" # NodePort Service range


# Firewall ports for Workers
k3s_worker_firewall_ports:
  - "10250/tcp"      # Kubelet API & metrics
  - "53/udp"         # CoreDNS (DNS service on 10.43.0.10)
  - "53/tcp"         # CoreDNS TCP
  - "8472/udp"       # Flannel VXLAN overlay (if used)
  - "51820/udp"      # Flannel Wireguard (IPv4)
  - "51821/udp"      # Flannel Wireguard (IPv6)
  - "30000-32767/tcp" # NodePort Service range

# Trusted subnets for cluster internal traffic
k3s_trusted_subnets:
  - "192.168.0.0/24"  # Physical node LAN (net0, external/management)
  - "10.20.20.0/24"   # Internal cluster network Stage (net1, VLAN 20 - etcd/kubelet/flannel)
  - "10.30.30.0/24"   # Internal cluster network Prod (net1, VLAN 30 - etcd/kubelet/flannel)
  - "10.42.0.0/16"    # K3s Pod CIDR
  - "10.43.0.0/16"    # K3s Service CIDR
