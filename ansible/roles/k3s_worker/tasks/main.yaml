---
# ==============================================================================
# K3s Worker Node Deployment, Storage Mount & Cluster Join
# ==============================================================================

# --- Step -1: Resolve Reachable Address of the Primary Control Plane ---
# net1 (internal cluster network) only exists on nodes recreated since it was
# introduced - if the primary hasn't been recreated yet, its internal IP
# answers nothing. Fall back to its external address rather than hanging a
# worker join on an address nothing is actually listening on.
- name: Check liveness of primary control plane via the internal cluster network (net1)
  ansible.builtin.wait_for:
    host: "{{ hostvars[k3s_primary_control_plane]['k3s_internal_ip'] }}"
    port: "{{ k3s_api_port }}"
    timeout: 5
  register: primary_liveness_internal
  ignore_errors: true
  changed_when: false

- name: Determine reachable address of the primary control plane (internal preferred, external fallback)
  ansible.builtin.set_fact:
    k3s_primary_control_plane_address: >-
      {{ hostvars[k3s_primary_control_plane]['k3s_internal_ip']
         if not primary_liveness_internal.failed
         else hostvars[k3s_primary_control_plane]['ansible_host'] }}

# --- Step 0: Check if K3s agent is already initialized ---
- name: Check if k3s agent is already initialized
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/agent/client-ca.crt
  register: k3s_agent_already_initialized

# --- Step 1: Format & Mount the Dedicated Data Disks (Longhorn + Container Runtime) ---
- name: Check if a secondary disk exists at all
  ansible.builtin.stat:
    path: "{{ k3s_worker_data_disk | default('/dev/sdb') }}"
  register: sdb_disk_stat

- name: Prepare and mount the dedicated data volumes with XFS
  when: sdb_disk_stat.stat.exists and not (k3s_agent_already_initialized.stat.exists | default(false))
  block:
    - name: Wait for udev to finish processing data disks before formatting
      ansible.builtin.command:
        cmd: udevadm settle --timeout=30
      changed_when: false
      failed_when: false

    # /dev/sdb is not a reliable name for "the data disk". Linux assigns
    # sd-letters in SCSI discovery-completion order, and AlmaLinux/RHEL's
    # default async SCSI scan means scsi0 (the OS root disk, cloned from
    # the CIS template) and the blank data disks can finish probing in any
    # order across boots - what we called "Device or resource busy" was
    # frequently this task pointed at the mounted, LVM-backed root disk,
    # not a udev timing gap; only the disk being too busy to format kept
    # that from being destructive. Identify by shape instead: the root disk
    # always has partitions (boot + LVM), the blank data disks never do.
    #
    # Shape alone stopped being sufficient once workers gained a second
    # blank disk for the container runtime - both are unpartitioned on a
    # fresh build. Size is the only intrinsic marker left that doesn't
    # trust sd-letter ordering, so the two are told apart by their declared
    # capacity (a 1GiB tolerance absorbs filesystem/reporting rounding).
    # Refuse to guess if that isn't unambiguous.
    - name: Identify the unpartitioned disk matching the Longhorn data disk size
      ansible.builtin.shell: |
        for d in /dev/sd?; do
          [ -b "$d" ] || continue
          [ "$(lsblk -nlo TYPE "$d" | grep -c '^part$')" -eq 0 ] || continue
          gib=$(( $(lsblk -bndo SIZE "$d") / 1073741824 ))
          if [ "$gib" -ge {{ k3s_worker_data_disk_size_gb | int - 1 }} ] && [ "$gib" -le {{ k3s_worker_data_disk_size_gb | int + 1 }} ]; then
            echo "$d"
          fi
        done
      register: longhorn_disk_candidates
      changed_when: false

    - name: Identify the unpartitioned disk matching the container runtime disk size
      ansible.builtin.shell: |
        for d in /dev/sd?; do
          [ -b "$d" ] || continue
          [ "$(lsblk -nlo TYPE "$d" | grep -c '^part$')" -eq 0 ] || continue
          gib=$(( $(lsblk -bndo SIZE "$d") / 1073741824 ))
          if [ "$gib" -ge {{ k3s_worker_runtime_disk_size_gb | int - 1 }} ] && [ "$gib" -le {{ k3s_worker_runtime_disk_size_gb | int + 1 }} ]; then
            echo "$d"
          fi
        done
      register: runtime_disk_candidates
      changed_when: false

    - name: Fail if either data disk can't be unambiguously identified
      ansible.builtin.assert:
        that:
          - longhorn_disk_candidates.stdout_lines | length == 1
          - runtime_disk_candidates.stdout_lines | length == 1
          - longhorn_disk_candidates.stdout_lines[0] != runtime_disk_candidates.stdout_lines[0]
        fail_msg: >-
          Expected exactly one unpartitioned {{ k3s_worker_data_disk_size_gb }}GiB disk
          (Longhorn) and one {{ k3s_worker_runtime_disk_size_gb }}GiB disk (container
          runtime). Found Longhorn candidates {{ longhorn_disk_candidates.stdout_lines }}
          and runtime candidates {{ runtime_disk_candidates.stdout_lines }}. Refusing to
          guess which one to format. If the two disks were provisioned at the same size,
          k3s_worker_data_disk_size_gb / k3s_worker_runtime_disk_size_gb no longer
          distinguish them and both must be re-checked against terraform.tfvars.

    - name: Build the data volume plan from the resolved devices
      ansible.builtin.set_fact:
        k3s_worker_volume_plan:
          - device: "{{ longhorn_disk_candidates.stdout_lines[0] }}"
            mount: "{{ k3s_worker_data_mount | default('/mnt/storage-data01') }}"
            purpose: Longhorn replica storage
          - device: "{{ runtime_disk_candidates.stdout_lines[0] }}"
            mount: "{{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }}"
            purpose: K3s container runtime storage

    - name: Format and persistently mount each dedicated data volume
      ansible.builtin.include_tasks: prepare_data_volume.yaml
      loop: "{{ k3s_worker_volume_plan }}"
      loop_control:
        loop_var: volume
        label: "{{ volume.device }} -> {{ volume.mount }} ({{ volume.purpose }})"

    - name: Ensure dedicated Longhorn storage directory exists on secondary disk
      ansible.builtin.file:
        path: "{{ longhorn_data_path | default('/mnt/storage-data01/longhorn') }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # k3s and kubelet both hardcode their paths under the CIS template's 5GB
    # /var LV, and one filesystem can only be mounted at one path - so the
    # runtime disk is mounted once and its subdirectories are bind-mounted
    # onto the paths each expects. Both then draw from the same 60GB pool
    # instead of needing a reserved slice apiece, which matters because the
    # image store's growth is driven by whatever gets scheduled.
    # Anything already at these paths on a node this block runs against is
    # scaffolding from package install - the k3s-selinux RPM creates
    # /var/lib/rancher and /var/lib/kubelet with their policy contexts during
    # k3s_common, before this role runs. It cannot be live cluster data: the
    # enclosing block only executes when the agent has never been initialized.
    # Relocate it into the backing store rather than bind-mounting over it,
    # which would hide those files while they still consumed the /var LV this
    # disk exists to relieve, and leave them invisible to df at that path.
    - name: Relocate any pre-existing runtime directory contents onto the dedicated disk
      ansible.builtin.shell: |
        set -e
        src="{{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }}/{{ item.subdir }}"
        tgt="{{ item.path }}"
        if mountpoint -q "$tgt"; then
          echo unchanged
          exit 0
        fi
        mkdir -p "$src"
        if [ -d "$tgt" ] && [ -n "$(ls -A "$tgt" 2>/dev/null)" ]; then
          # -a keeps ownership and mode; contexts are reapplied by the
          # restorecon that follows the equivalency declaration below.
          cp -a "$tgt"/. "$src"/
          find "$tgt" -mindepth 1 -delete
          echo migrated
          exit 0
        fi
        mkdir -p "$tgt"
        echo clear
      register: runtime_bind_migration
      changed_when: "'migrated' in runtime_bind_migration.stdout"
      loop: "{{ k3s_worker_runtime_binds }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure runtime subdirectories exist on the dedicated disk
      ansible.builtin.file:
        path: "{{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }}/{{ item.subdir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ k3s_worker_runtime_binds }}"
      loop_control:
        label: "{{ item.subdir }}"

    # SELinux contexts live on inodes, not paths. restorecon on the bind
    # target labels them correctly now, but the policy still considers these
    # inodes to live at {{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }},
    # so any relabel that walks the real filesystem - fixfiles, a /.autorelabel
    # boot after CIS policy remediation, or a stray restorecon -R /mnt - resets
    # them to mnt_t and k3s fails to start on the next boot. Declaring an
    # equivalency makes the policy compute the right contexts from either path,
    # so the labelling survives a relabel instead of silently reverting.
    - name: Declare SELinux file context equivalency for the relocated runtime directories
      ansible.builtin.shell: |
        src="{{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }}/{{ item.subdir }}"
        tgt="{{ item.path }}"
        if semanage fcontext -l -C 2>/dev/null | grep -qE "^${src}( |=)" ; then
          echo unchanged
          exit 0
        fi
        semanage fcontext -a -e "$tgt" "$src" || semanage fcontext -m -e "$tgt" "$src"
        echo changed
      register: runtime_fcontext_equiv
      changed_when: "'changed' in runtime_fcontext_equiv.stdout"
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - (ansible_facts['selinux']['status'] | default('disabled')) != 'disabled'
      loop: "{{ k3s_worker_runtime_binds }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Apply the equivalent contexts to the backing directories on the runtime disk
      ansible.builtin.command:
        cmd: restorecon -R {{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }}
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - (ansible_facts['selinux']['status'] | default('disabled')) != 'disabled'
      register: runtime_backing_restorecon
      failed_when: runtime_backing_restorecon.rc != 0 and 'No such file' not in runtime_backing_restorecon.stderr
      changed_when: false

    - name: Ensure runtime bind target directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ k3s_worker_runtime_binds }}"
      loop_control:
        label: "{{ item.path }}"

    # These entries must land in fstab after the runtime disk's own UUID
    # entry, which the include above already wrote - ansible.posix.mount
    # appends, so ordering follows task order here.
    - name: Bind-mount the runtime directories onto the dedicated disk persistently
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ k3s_worker_runtime_mount | default('/mnt/k8s-data') }}/{{ item.subdir }}"
        fstype: none
        opts: bind,nofail
        state: mounted
      loop: "{{ k3s_worker_runtime_binds }}"
      loop_control:
        label: "{{ item.path }}"

    # A bind mount presents the *underlying* directory's SELinux context at
    # the target, not the one k3s and kubelet expect at their own paths.
    # Without relabelling, the agent fails to start with permission errors
    # that don't obviously read as SELinux denials.
    - name: Restore SELinux file contexts on the relocated runtime directories
      ansible.builtin.command:
        cmd: restorecon -R {{ item.path }}
      loop: "{{ k3s_worker_runtime_binds }}"
      loop_control:
        label: "{{ item.path }}"
      when: ansible_facts['os_family'] == 'RedHat'
      register: runtime_restorecon
      failed_when: runtime_restorecon.rc != 0 and 'No such file' not in runtime_restorecon.stderr
      changed_when: false

# --- Step 1.5: Stale Agent State Cleanup on Unclean Worker Nodes ---
- name: Check if k3s agent is already initialized
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/agent/client-ca.crt
  register: k3s_already_initialized

- name: Clean stale agent state when joining a newly bootstrapped cluster
  when: not (rejoining_existing_cluster | default(false)) and not (k3s_already_initialized.stat.exists | default(false))
  block:
    - name: Check if existing agent credentials exist from prior cluster
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/agent
      register: stale_agent_stat

    - name: Stop K3s agent and remove stale state to prevent TLS authority mismatches
      when: stale_agent_stat.stat.exists
      block:
        - name: Stop k3s-agent service
          ansible.builtin.systemd:
            name: k3s-agent
            state: stopped
          failed_when: false

        - name: Stop and disable any lingering k3s server service on worker
          ansible.builtin.systemd:
            name: k3s
            state: stopped
            enabled: false
          failed_when: false

        - name: Remove stale K3s agent data directory and local kubeconfig
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /var/lib/rancher/k3s/agent
            - /etc/rancher/k3s/k3s.yaml


# --- Step 2: K3s Agent Configuration & Join ---

- name: Create K3s configuration directory

  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy K3s worker node config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0600'
  register: k3s_worker_config_result

- name: Check if K3s agent binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_bin_stat

- name: Check if K3s agent systemd service file is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service_stat

- name: Get currently installed K3s version
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_agent_installed_version
  changed_when: false
  failed_when: false
  when: k3s_agent_bin_stat.stat.exists

- name: Download and install K3s agent binary and systemd service
  when: >-
    (not k3s_agent_bin_stat.stat.exists) or (not k3s_agent_service_stat.stat.exists)
    or (k3s_version not in (k3s_agent_installed_version.stdout | default('')))
  block:
    # get.k3s.io and the GitHub release CDN are both external dependencies
    # reached by every node at once during a cold build, so a single dropped
    # connection here fails the whole deployment. Retry rather than treating
    # a transient network blip as a fatal error.
    - name: Download K3s official install script
      ansible.builtin.get_url:
        url: "https://get.k3s.io"
        dest: /root/k3s-install.sh
        mode: '0755'
      register: k3s_install_script_download
      until: k3s_install_script_download is succeeded
      retries: 5
      delay: 10

    - name: Execute K3s agent installation script (binary & service registration)
      ansible.builtin.command:
        cmd: bash /root/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "agent"
        INSTALL_K3S_SKIP_START: "true"
        INSTALL_K3S_SKIP_SELINUX_RPM: "true"
        K3S_URL: "https://{{ k3s_primary_control_plane_address }}:{{ k3s_api_port }}"
        K3S_TOKEN: "{{ k3s_token }}"
      register: k3s_agent_install_result
      until: k3s_agent_install_result is succeeded
      retries: 5
      delay: 15
      changed_when: true

    - name: Remove K3s install script
      ansible.builtin.file:
        path: /root/k3s-install.sh
        state: absent

- name: Restore SELinux file contexts on K3s agent directories & binaries
  ansible.builtin.command:
    cmd: restorecon -R -v /etc/rancher/k3s /var/lib/rancher/k3s /usr/local/bin/k3s /etc/systemd/system/k3s-agent.service {{ k3s_worker_data_mount | default('/mnt/storage-data01') }}
  when: ansible_facts['os_family'] == 'RedHat'
  register: restorecon_result
  failed_when: restorecon_result.rc != 0 and 'No such file' not in restorecon_result.stderr
  changed_when: false

- name: Ensure stale node object and node-password secret are cleared on control plane for clean join
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl delete node {{ inventory_hostname }} --ignore-not-found=true
    /usr/local/bin/k3s kubectl delete secret -n kube-system {{ inventory_hostname }}.node-password --ignore-not-found=true
    /usr/local/bin/k3s kubectl delete secret -n kube-system k3s.{{ inventory_hostname }}.node-password --ignore-not-found=true
  delegate_to: "{{ k3s_primary_control_plane }}"
  when: not (k3s_already_initialized.stat.exists | default(false))
  failed_when: false
  changed_when: false

- name: Wait for primary K3s control plane API port 6443 to be responsive before worker join
  ansible.builtin.wait_for:
    host: "{{ k3s_primary_control_plane_address }}"
    port: "{{ k3s_api_port }}"
    delay: 2
    timeout: 120


- name: Start or restart K3s agent service
  block:
    - name: Ensure K3s agent service is started or restarted on config change
      ansible.builtin.systemd:
        name: k3s-agent
        daemon_reload: true
        # The install script runs with INSTALL_K3S_SKIP_START, so it only writes
        # the binary - a restart is the only thing that makes a new version take
        # effect. Restarting solely on a config change meant a version bump left
        # the new binary on disk with the old process still running, and the node
        # kept reporting the old version indefinitely. k3s_force_restart is set by
        # rolling_update.yaml, where the node is already drained and a restart is
        # the entire point; site.yaml leaves it unset and keeps the old behaviour
        # of not bouncing healthy nodes needlessly.
        state: >-
          {{ 'restarted'
             if (k3s_agent_bin_stat.stat.exists and k3s_agent_service_stat.stat.exists
                 and (k3s_force_restart | default(false)
                      or k3s_worker_config_result.changed
                      or (k3s_agent_install_result is defined and k3s_agent_install_result is changed)))
             else 'started' }}
        enabled: true
      register: k3s_agent_start_result
      until: k3s_agent_start_result is not failed
      retries: 5
      delay: 6


  rescue:
    - name: Capture K3s agent journal logs on startup failure
      ansible.builtin.command:
        cmd: journalctl -xeu k3s-agent.service -n 100 --no-pager
      register: k3s_agent_journal_logs
      changed_when: false

    - name: Display K3s agent journal logs to console
      ansible.builtin.debug:
        var: k3s_agent_journal_logs.stdout_lines

    - name: Fail task with explicit worker startup error summary
      ansible.builtin.fail:
        msg: "k3s-agent.service failed to start or restart. Review detailed journalctl output above."



- name: Verify worker node is registered and Ready on control plane
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ k3s_primary_control_plane }}"
  register: worker_ready_check
  until: worker_ready_check.rc == 0 and worker_ready_check.stdout == "True"
  retries: 30
  delay: 6
  changed_when: false

- name: Label worker node with role in Kubernetes
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=true --overwrite
  delegate_to: "{{ k3s_primary_control_plane }}"
  changed_when: true

