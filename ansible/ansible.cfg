[defaults]
roles_path         = roles
remote_user        = almalinux
host_key_checking  = False
retry_files_enabled = False
timeout            = 45
remote_tmp         = ~/.ansible/tmp
deprecation_warnings = False
forks              = 5

[privilege_escalation]
become             = True
become_method      = sudo
become_user        = root
become_ask_pass    = False

[ssh_connection]
pipelining         = True
retries            = 5
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectionAttempts=5 -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
