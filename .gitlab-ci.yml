# ==============================================================================
# GitLab CI/CD Root Orchestrator: Multi-Environment Child Pipelines
# ==============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "manual"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "*.md"
        - "docs/**/*"
        - "LICENSE"
        - ".gitignore"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  TARGET_ENV:
    value: "stage"
    options:
      - "stage"
      - "prod"
      - "all"
    description: "Target environment to execute child deployment pipeline"

stages:
  - validate
  - deploy:stage
  - deploy:prod

# -------------------------------------------------------------------
# Global Linting & Syntax Checks (MRs & Default Branch)
# -------------------------------------------------------------------
include:
  - local: .gitlab/ci/validate.gitlab-ci.yml

# -------------------------------------------------------------------
# STAGE Child Pipeline
# -------------------------------------------------------------------
stage:pipeline:
  stage: deploy:stage
  trigger:
    include: .gitlab/ci/stage.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $TARGET_ENV == "prod"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - environments/stage/**/*
        - terraform/modules/**/*
        - ansible/**/*
        - scripts/**/*
        - .gitlab/ci/stage.gitlab-ci.yml
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# -------------------------------------------------------------------
# PROD Child Pipeline (Manual One-Click Promotion Gate)
# -------------------------------------------------------------------
prod:pipeline:
  stage: deploy:prod
  trigger:
    include: .gitlab/ci/prod.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $TARGET_ENV == "stage"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $TARGET_ENV == "prod"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - environments/prod/**/*
        - terraform/modules/**/*
        - ansible/**/*
        - scripts/**/*
        - .gitlab/ci/prod.gitlab-ci.yml
      when: manual
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
