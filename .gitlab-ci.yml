# ==============================================================================
# GitLab CI/CD Root Orchestrator: Multi-Environment Child Pipelines
# ==============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "manual"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Deploy from main when something that actually affects the deployment
    # changed. This was previously expressed as "never, if docs changed", but
    # rules:changes matches when ANY listed path changed - so an ordinary commit
    # touching both code and a doc silently skipped the whole pipeline. Listing
    # the deployment-relevant paths positively gives the behaviour that was
    # intended: docs-only pushes don't deploy, mixed pushes do.
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"
        - "ansible/**/*"
        - "environments/**/*"
        - "terraform/**/*"
        - "scripts/**/*"
        - "Makefile"

variables:
  TARGET_ENV:
    value: "STAGE"
    options:
      - "STAGE"
      - "PROD"
      - "ALL"
      - "stage"
      - "prod"
      - "all"
    description: "Target environment to execute child deployment pipeline"

  PIPELINE_ACTION:
    value: "deploy"
    options:
      - "deploy"
      - "recover-node"
    description: "Action to execute: 'deploy' (full cluster rollout) or 'recover-node' (single VM rebuild & rejoin)"

  NODE_NAME:
    value: ""
    description: "Node hostname to rebuild during 'recover-node' (e.g. k3s-wk-p-g7h8, k3s-cp-p-a1b2, k3s-wk-s-g7h8)"

stages:
  - validate
  - deploy:stage
  - deploy:prod

# -------------------------------------------------------------------
# Global Linting & Syntax Checks (MRs, Tags & Default Branch)
# -------------------------------------------------------------------
include:
  - local: .gitlab/ci/validate.gitlab-ci.yml

# -------------------------------------------------------------------
# STAGE Child Pipeline
# -------------------------------------------------------------------
stage:pipeline:
  stage: deploy:stage
  trigger:
    include: .gitlab/ci/stage.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/ || $CI_COMMIT_TAG =~ /^prod/
      when: never # Tag release is dedicated to PROD promotion
    - if: $CI_PIPELINE_SOURCE == "web" && ($TARGET_ENV == "prod" || $TARGET_ENV == "PROD")
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# -------------------------------------------------------------------
# PROD Child Pipeline (Triggered via Promote Tag or Manual Gate)
# -------------------------------------------------------------------
prod:pipeline:
  stage: deploy:prod
  trigger:
    include: .gitlab/ci/prod.gitlab-ci.yml
    strategy: depend
  rules:
    # 1. Automatic PROD deployment when promoted via Git Tag (e.g. v1.0.0 or prod-release)
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/ || $CI_COMMIT_TAG =~ /^prod/
      when: on_success
    # 2. Web UI trigger targeting PROD
    - if: $CI_PIPELINE_SOURCE == "web" && ($TARGET_ENV == "stage" || $TARGET_ENV == "STAGE")
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && ($TARGET_ENV == "prod" || $TARGET_ENV == "PROD" || $TARGET_ENV == "all" || $TARGET_ENV == "ALL")
      when: on_success
    # 3. One-click manual promotion button in GitLab UI pipeline graph
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
